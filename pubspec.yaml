# ============================================================
# Relay Flow — Flutter/Android template
# ============================================================
# This template ships as `relay_template`. Every new project runs
# `dart run tool/forge/mint.dart` which rotates:
#
#   • `name:`         — a fresh snake_case slug of the display name
#   • `description:`  — a short white-part game description
#   • `version:`      — reset to 1.0.0+1 for the first build
#   • minor version   — a subset of plugins gets a minor bump so no
#                       two consecutive projects share the exact
#                       dependency graph. See
#                       `.cursor/rules/portfolio_registry.md`.
#
# [FORGE] Never ship two consecutive projects with an identical
# `name:` / `description:` / `version:` triplet, and never with the
# same dependency version tuple. `mint.dart` refuses to run against
# the portfolio registry if it would create a duplicate.
# ============================================================

name: relay_template # [FORGE]
description: "Relay template — regenerated per project by tool/forge." # [FORGE]
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Relay flow stack ──
  # ⚠️ DO NOT upgrade file_picker beyond 8.x — see
  # gray_part_pitfalls.md §1 (Kotlin-only 10.x collides with Flutter
  # KGP). This template does not depend on file_picker (native chooser
  # over MethodChannel), but keep the constraint in mind if you add it.
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.13.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  appsflyer_sdk: ^6.18.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  device_info_plus: 11.4.0
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true

  # [FORGE] Rename the second folder to a project-specific addon
  # pack. The forge tool renames it on disk and rewrites this
  # declaration in one step — do not hand-edit.
  assets:
    - assets/gameplay_assets/
    - assets/SkywardTowers_additional_assets_webp/

flutter_launcher_icons:
  # [FORGE] Replace the source PNGs before shipping. Requirements:
  #   • adaptive icon fills the mask, no empty borders, no clipping
  #   • different silhouette from the notification icon
  android: true
  ios: true
  image_path: "assets/generated/app_icon.png"
  adaptive_icon_background: "assets/generated/app_icon.png"
  adaptive_icon_foreground: "assets/generated/app_icon_foreground.png"
  remove_alpha_ios: true
